<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1010" viewBox="0 0 1400 1010" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="1400" height="1010" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs>
<text x="40" y="40" font-size="21" text-anchor="start" dominant-baseline="central" fill="#1a1a1a" font-weight="bold">Diagram 2 — Complete System Architecture</text>
<text x="40" y="66" font-size="13" text-anchor="start" dominant-baseline="central" fill="#6b6b6b">KGCR unified flow: one pipeline, two entry conditions (FD-01, stages S1 to S10)</text>
<rect x="80" y="110" width="300" height="66" rx="4" fill="#e8eef4" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="230.0" y="126.0" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1a1a1a">Condition 1 — Design</text>
<text x="230.0" y="143.0" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1a1a1a">"design me a config for..."</text>
<text x="230.0" y="160.0" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1a1a1a">user states intent in business terms</text>
<rect x="1020" y="110" width="300" height="66" rx="4" fill="#e8eef4" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="1170.0" y="126.0" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1a1a1a">Condition 2 — Review</text>
<text x="1170.0" y="143.0" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1a1a1a">"what is wrong with my config"</text>
<text x="1170.0" y="160.0" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1a1a1a">Agent 2 harvests the live estate</text>
<rect x="80" y="210" width="300" height="54" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="230.0" y="228.5" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1a1a1a">S1  Intent capture</text>
<text x="230.0" y="245.5" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1a1a1a">LLM structured extraction to WorkloadIntent</text>
<rect x="1020" y="210" width="300" height="54" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="1170.0" y="228.5" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1a1a1a">S1b  Intent reconstruction</text>
<text x="1170.0" y="245.5" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1a1a1a">recover intent from estate structure</text>
<rect x="1020" y="292" width="300" height="46" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="1170.0" y="306.5" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1a1a1a">Per-field confidence</text>
<text x="1170.0" y="323.5" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1a1a1a">below threshold: confirm with the user</text>
<rect x="470" y="300" width="460" height="54" rx="4" fill="#e8eef4" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="700.0" y="318.5" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1a1a1a">S2  Knowledge graph query + constraint mask</text>
<text x="700.0" y="335.5" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1a1a1a">candidates ranked by the Recommender</text>
<rect x="470" y="386" width="460" height="46" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="700.0" y="409.0" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1a1a1a">S3  Candidate specification assembled</text>
<rect x="470" y="466" width="460" height="54" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="700.0" y="484.5" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1a1a1a">S4  Advisor review (bounded iteration)</text>
<text x="700.0" y="501.5" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1a1a1a">grounded in L1 controls, never in the Recommender's output</text>
<rect x="150" y="466" width="260" height="54" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="280.0" y="484.5" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1a1a1a">Advisor findings</text>
<text x="280.0" y="501.5" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1a1a1a">implement suggestions in the spec</text>
<rect x="980" y="466" width="320" height="54" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="1140.0" y="476.0" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1a1a1a">Non-convergence</text>
<text x="1140.0" y="493.0" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1a1a1a">report contested findings rather than</text>
<text x="1140.0" y="510.0" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1a1a1a">manufacturing agreement</text>
<rect x="470" y="566" width="460" height="54" rx="4" fill="#e8eef4" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="700.0" y="584.5" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1a1a1a">S5  Dependency graph of the specification</text>
<text x="700.0" y="601.5" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1a1a1a">multi-hop relational checks (defect class DF-7)</text>
<rect x="470" y="646" width="460" height="54" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="700.0" y="664.5" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1a1a1a">S6  Explanation</text>
<text x="700.0" y="681.5" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1a1a1a">reasoning subgraph + counterfactual, audience-relative</text>
<rect x="470" y="726" width="460" height="46" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="700.0" y="749.0" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1a1a1a">S7  User gate — accept specification and dependency graph?</text>
<rect x="80" y="726" width="300" height="46" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="230.0" y="740.5" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1a1a1a">User inputs changes</text>
<text x="230.0" y="757.5" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1a1a1a">spec updated, return to S4</text>
<rect x="470" y="806" width="460" height="54" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="700.0" y="824.5" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1a1a1a">S8  Terraform plan (Agent 1)</text>
<text x="700.0" y="841.5" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1a1a1a">preview only; blast radius reported</text>
<rect x="470" y="886" width="460" height="46" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="700.0" y="909.0" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1a1a1a">S9 Apply   ·   S10 Run record persisted to L3</text>
<rect x="1000" y="806" width="320" height="54" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="1160.0" y="824.5" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1a1a1a">Post-apply drift check</text>
<text x="1160.0" y="841.5" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1a1a1a">re-harvest, compare, feed L3</text>
<line x1="230" y1="176" x2="230" y2="210" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="1170" y1="176" x2="1170" y2="210" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="1170" y1="264" x2="1170" y2="292" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="380" y1="237" x2="700" y2="237" stroke="#1a1a1a" stroke-width="1.4"/>
<line x1="700" y1="237" x2="700" y2="300" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="1020" y1="327" x2="932" y2="327" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="700" y1="354" x2="700" y2="386" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="700" y1="432" x2="700" y2="466" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="470" y1="493" x2="412" y2="493" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
<text x="441.0" y="484.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6b6b6b">revise</text>
<line x1="280" y1="466" x2="280" y2="409" stroke="#1a1a1a" stroke-width="1.4"/>
<line x1="280" y1="409" x2="468" y2="409" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="930" y1="493" x2="978" y2="493" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
<text x="954" y="474" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6b6b6b">iteration cap reached</text>
<line x1="700" y1="520" x2="700" y2="566" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
<text x="700.0" y="534.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6b6b6b">approved</text>
<line x1="700" y1="620" x2="700" y2="646" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="700" y1="700" x2="700" y2="726" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="470" y1="749" x2="382" y2="749" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
<text x="426.0" y="740.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6b6b6b">no</text>
<line x1="230" y1="726" x2="230" y2="540" stroke="#1a1a1a" stroke-width="1.4"/>
<line x1="230" y1="540" x2="448" y2="540" stroke="#1a1a1a" stroke-width="1.4"/>
<line x1="448" y1="540" x2="448" y2="500" stroke="#1a1a1a" stroke-width="1.4"/>
<line x1="448" y1="500" x2="468" y2="500" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="700" y1="772" x2="700" y2="806" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
<text x="700.0" y="780.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6b6b6b">yes</text>
<line x1="700" y1="860" x2="700" y2="886" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="930" y1="833" x2="998" y2="833" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="1320" y1="833" x2="1355" y2="833" stroke="#1a1a1a" stroke-width="1.4"/>
<line x1="1355" y1="833" x2="1355" y2="315" stroke="#1a1a1a" stroke-width="1.4"/>
<line x1="1355" y1="315" x2="1322" y2="315" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
<text x="1240" y="880" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6b6b6b">confirmed intent feeds L3</text>
<text x="40" y="962" font-size="12" text-anchor="start" dominant-baseline="central" fill="#6b6b6b">Invariant — the audience setting changes only how a result is rendered. The conclusion is identical for architect, auditor and learner, and this is tested rather than asserted.</text>
<text x="40" y="986" font-size="12" text-anchor="start" dominant-baseline="central" fill="#1a1a1a">Implemented today: S1b intent reconstruction with per-field calibration, the estate dependency graph, and the defect corpus. S2, S4 and S6 are Phase-II.</text>
</svg>