<text x="40" y="868" font-size="12" text-anchor="start" dominant-baseline="central" fill="#6b6b6b">Monitoring: Amazon CloudWatch logs, metrics and alarms; AWS Budgets alarms live from day one (FD-08).   Notifications: Amazon SNS.</text>
<text x="40" y="898" font-size="12" text-anchor="start" dominant-baseline="central" fill="#1a1a1a">Status — this is a Phase-I planning diagram. Implemented today: the AWS Budgets and cross-account IAM Terraform in src/aws/ (authored, not applied). Everything else is the Phase-II</text>
<text x="40" y="920" font-size="12" text-anchor="start" dominant-baseline="central" fill="#1a1a1a">build target; the analysis pipeline currently runs locally in Python under src/backend/.</text>
